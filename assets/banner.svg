<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="Joshua Hayes: software engineer building things that leave the screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#131a35"/>
      <stop offset="1" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff7ab6"/>
      <stop offset="1" stop-color="#7cc4ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7ab6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7ab6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .drift-a { animation: driftA 14s ease-in-out infinite alternate; }
    .drift-b { animation: driftB 18s ease-in-out infinite alternate; }
    .drift-c { animation: driftC 11s ease-in-out infinite alternate; }
    .name { animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both; }
    .rule { transform-origin: 80px 0; animation: grow 1.1s 0.35s cubic-bezier(.2,.8,.2,1) both; }
    .line { opacity: 0; animation: cycle 16s infinite; }
    .l2 { animation-delay: 4s; }
    .l3 { animation-delay: 8s; }
    .l4 { animation-delay: 12s; }
    .caret { animation: blink 1s steps(1) infinite; }
    .spark { animation: twinkle 3.2s ease-in-out infinite; }
    .s2 { animation-delay: 0.8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.3s; }
    @keyframes driftA { from { transform: translate(0, 0); } to { transform: translate(90px, 40px); } }
    @keyframes driftB { from { transform: translate(0, 0); } to { transform: translate(-110px, -30px); } }
    @keyframes driftC { from { transform: translate(0, 0); } to { transform: translate(60px, -50px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(10px); }
      3%, 22% { opacity: 1; transform: none; }
      25%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) {
      .drift-a, .drift-b, .drift-c, .name, .rule, .caret, .spark { animation: none; }
      .line { animation: none; }
      .l1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <circle class="drift-a" cx="930" cy="70" r="260" fill="url(#glowA)"/>
    <circle class="drift-b" cx="1120" cy="300" r="240" fill="url(#glowB)"/>
    <circle class="drift-c" cx="180" cy="330" r="220" fill="url(#glowC)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <g fill="#ffffff">
      <circle class="spark" cx="720" cy="62" r="2"/>
      <circle class="spark s2" cx="1010" cy="150" r="2.5"/>
      <circle class="spark s3" cx="860" cy="262" r="1.8"/>
      <circle class="spark s4" cx="1105" cy="58" r="1.6"/>
      <circle class="spark s2" cx="610" cy="286" r="1.6"/>
    </g>

    <text class="mono" x="80" y="92" font-size="20" fill="#9fb0d8" letter-spacing="1">~/joshua $ whoami</text>

    <text class="sans name" x="76" y="182" font-size="92" font-weight="800" fill="url(#ink)" letter-spacing="-2">Joshua Hayes</text>

    <rect class="rule" x="80" y="208" width="150" height="5" rx="2.5" fill="url(#ink)"/>

    <g class="mono" font-size="25" fill="#e8ecf8">
      <text class="line l1" x="110" y="268">Software engineer at Markel</text>
      <text class="line l2" x="110" y="268">Sensors and software against campus hunger</text>
      <text class="line l3" x="110" y="268">Go, Python, TypeScript and a lot of AWS</text>
      <text class="line l4" x="110" y="268">I use Arch, by the way</text>
    </g>
    <text class="mono caret" x="80" y="268" font-size="25" font-weight="700" fill="#ffd166">&gt;</text>
  </g>
</svg>
